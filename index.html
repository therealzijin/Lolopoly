<!doctype html>
<html lang="zh-Hant" id="html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>兩人大富翁</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
:root{
  --felt:#234B48; --felt-dark:#1B3B39; --felt-line:#2F5F5B;
  --paper:#FFF4DE; --paper-dim:#EFE2C8; --ink:#2B2420; --ink-soft:#6B5F58;
  --p0:#FF6B57; --p1:#4D9DE0; --gold:#F2C14E;
  --g粉:#F7A1C4; --g橘:#FFA25B; --g黃:#F2D45C; --g綠:#7ED3A3; --g藍:#7FB6F0; --g紫:#C39BF2; --g金:#F2C14E;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,"PingFang TC","Hiragino Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--felt);
  background-image:radial-gradient(circle at 50% 0%,#2C5B57 0,var(--felt) 55%,var(--felt-dark) 100%);
  color:var(--paper); min-height:100%; padding:14px 12px 24px; max-width:520px; margin:0 auto;
}
button{font:inherit;border:0;border-radius:14px;padding:13px 16px;font-weight:700;cursor:pointer;color:var(--ink);background:var(--paper)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold)}
button.ghost{background:transparent;color:var(--paper);border:2px solid var(--felt-line)}
button.p0{background:var(--p0);color:#fff} button.p1{background:var(--p1);color:#fff}
input{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--felt-line);background:var(--felt-dark);color:var(--paper);font-size:17px}
input:focus{outline:none;border-color:var(--gold)}
.screen{display:none}.screen.on{display:block}
h1{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.01em;margin:8px 0 4px}
.sub{color:#BFD3CF;font-size:15px;line-height:1.5;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;color:#BFD3CF;margin-bottom:6px}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;background:var(--felt-dark);color:var(--paper);border:2px solid var(--felt-line);padding:12px 8px;border-radius:12px}
.seg button.sel{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.seg small{display:block;font-weight:500;font-size:12px;opacity:.75;margin-top:2px}
.stack{display:grid;gap:10px;margin-top:8px}
.note{font-size:13px;color:#BFD3CF;line-height:1.5;margin-top:14px}
.code{font-size:56px;font-weight:800;letter-spacing:.12em;text-align:center;margin:18px 0 6px;color:var(--gold)}
.center{text-align:center}
.err{color:#FFB4A8;font-size:14px;margin-top:8px;min-height:1.2em}

/* game */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;color:#BFD3CF}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pl{background:var(--felt-dark);border-radius:12px;padding:8px 10px;border:2px solid transparent;display:flex;align-items:center;gap:8px}
.pl.turn{border-color:var(--paper)}
.dot{width:18px;height:18px;border-radius:50%;display:inline-block;flex:none;border:2px solid #fff}
.dot.p0{background:var(--p0)} .dot.p1{background:var(--p1)}
.pl .nm{font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .money{font-size:17px;font-weight:800;line-height:1.2}
.pl .worth{font-size:11px;color:#BFD3CF;line-height:1.2}
.board{display:grid;grid-template-columns:repeat(4,1fr);width:100%;gap:4px}
.tile{position:relative;background:var(--paper);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;align-items:center;color:var(--ink);min-width:0;padding-bottom:18px}
.board.quick .tile{min-height:74px} .board.classic .tile{min-height:60px}
.tile .band{width:100%;height:7px;flex:none}
.tile .idx{position:absolute;top:9px;left:4px;font-size:9px;color:var(--ink-soft);opacity:.7}
.tile .tn{font-size:12px;font-weight:700;line-height:1.15;text-align:center;padding:4px 3px 0;word-break:break-all}
.board.classic .tile .tn{font-size:11px;padding-top:3px}
.tile .tp{font-size:11px;color:var(--ink-soft);line-height:1.2;margin-top:1px}
.tile .lv{font-size:11px;line-height:1.2;margin-top:1px;color:var(--ink)}
.tile.corner{background:var(--paper-dim)}
.tile.own0{box-shadow:inset 0 0 0 3px var(--p0)} .tile.own1{box-shadow:inset 0 0 0 3px var(--p1)}
.tile.own0 .band{background:var(--p0)!important} .tile.own1 .band{background:var(--p1)!important}
.tile.hot{box-shadow:inset 0 0 0 3px var(--gold);background:#FFFBEF}
.tk{position:absolute;bottom:3px;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tk.p0{background:var(--p0);left:4px} .tk.p1{background:var(--p1);right:4px}
.die{width:48px;height:48px;border-radius:10px;background:var(--paper);color:var(--ink);font-size:40px;line-height:48px;font-weight:800;text-align:center}
.die.roll{animation:shake .5s linear infinite}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}100%{transform:rotate(0)}}
@media(prefers-reduced-motion:reduce){.die.roll{animation:none}}
.panel{margin-top:12px;background:var(--felt-dark);border-radius:16px;padding:12px 14px}
.panel .say{font-size:15px;line-height:1.45;min-height:1.4em;margin-bottom:10px}
.panel .say b{color:var(--gold)}
.controls{display:flex;gap:10px;align-items:center}
.dice{display:flex;gap:6px;flex:none}
.actions{display:grid;gap:8px;grid-template-columns:1fr 1fr;flex:1}
.actions button{padding:13px 8px}
.actions button.wide{grid-column:1/-1}
.log{margin-top:12px;font-size:13px;line-height:1.55;color:#BFD3CF;max-height:150px;overflow:auto;padding-right:4px}
.log div{padding:2px 0;border-bottom:1px dashed var(--felt-line)}
.log div:first-child{color:var(--paper)}
.over{background:var(--paper);color:var(--ink);border-radius:18px;padding:22px 18px;text-align:center;margin-top:12px}
.over h2{font-size:28px;font-weight:800;margin-bottom:6px}
.over p{color:var(--ink-soft);font-size:15px;line-height:1.5;margin-bottom:14px}
</style>
</head>
<body>

<!-- 首頁 -->
<section id="s-home" class="screen on">
  <div class="seg" id="seg-lang" style="max-width:220px;margin-bottom:6px">
    <button data-v="zh">中文</button><button data-v="ja">日本語</button>
  </div>
  <h1 data-i="title"></h1>
  <p class="sub" data-i="sub"></p>

  <div class="field"><label for="myname" data-i="myname"></label><input id="myname" maxlength="8" data-ph="myname_ph" autocomplete="off"></div>
  <div class="field" id="f-name2" style="display:none"><label for="name2" data-i="name2"></label><input id="name2" maxlength="8" data-ph="name2_ph" autocomplete="off"></div>

  <div class="field"><label data-i="how"></label>
    <div class="seg" id="seg-conn">
      <button data-v="online" class="sel"><span data-i="online"></span><small data-i="online_s"></small></button>
      <button data-v="local"><span data-i="local"></span><small data-i="local_s"></small></button>
    </div>
  </div>

  <div class="field" id="f-mode"><label data-i="mode"></label>
    <div class="seg" id="seg-mode">
      <button data-v="quick" class="sel"><span data-i="quick"></span><small data-i="quick_s"></small></button>
      <button data-v="classic"><span data-i="classic"></span><small data-i="classic_s"></small></button>
    </div>
  </div>

  <div class="stack">
    <button class="primary" id="b-create"></button>
    <div class="seg" style="margin:0"><input id="joincode" inputmode="numeric" maxlength="4" data-ph="code_ph" style="flex:1"><button id="b-join" style="flex:none" data-i="join"></button></div>
    <div class="err" id="home-err"></div>
  </div>
  <p class="note" id="home-note" data-i="note"></p>
</section>

<!-- 大廳 -->
<section id="s-lobby" class="screen">
  <h1 data-i="lobby_title"></h1>
  <p class="sub" data-i="lobby_sub"></p>
  <div class="code" id="lobby-code">0000</div>
  <p class="center sub" id="lobby-status"></p>
  <div class="stack">
    <button class="primary" id="b-start" disabled data-i="start"></button>
    <button class="ghost" id="b-leave" data-i="leave"></button>
  </div>
</section>

<!-- 遊戲 -->
<section id="s-game" class="screen">
  <div class="topbar"><span id="g-mode"></span><span id="g-round"></span><button class="ghost" id="b-lang" style="padding:4px 10px;border-radius:8px;font-size:12px"></button></div>
  <div class="players" id="g-players"></div>
  <div class="board" id="board"></div>
  <div class="panel" id="panel">
    <div class="say" id="say"></div>
    <div class="controls"><div class="dice" id="dice"></div><div class="actions" id="actions"></div></div>
  </div>
  <div id="over"></div>
  <div class="log" id="log"></div>
</section>

function logText(e){const p=Object.assign({},e.p||{});if(p.ti!=null)p.t=tileName(p.ti);if(p.ci!=null)p.c=CARDS[p.ci].txt[lang];if(p.wi!=null)p.w=WHEEL[p.wi].txt[lang];return fmt(S().log[e.k],p)}

/* ---------- 狀態 ---------- */
let st=null;            // 共享遊戲狀態
let net={online:false,code:'',me:0};
let timer=null, busy=false;
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const hasStorage=()=>typeof window.storage!=='undefined' && window.storage && window.storage.get;
const key=()=> 'room:'+net.code;

function newState(mode,names){
  const c=CFG[mode];
  return {
    mode, phase:'lobby', seq:1, code:net.code, guestJoined:false,
    players:[{name:names[0]||'玩家一',money:c.start,pos:0,skip:0},{name:names[1]||'玩家二',money:c.start+100,pos:0,skip:0}],
    owners:{}, turn:0, round:1, step:'roll', pending:null, dice:[], winner:null, log:[]
  };
}
function tiles(){return TILES[st.mode]}
function cfg(){return CFG[st.mode]}
function log(k,p){st.log.unshift({k,p}); if(st.log.length>30) st.log.length=30;}
function groupTiles(g){return tiles().map((t,i)=>t.g===g?i:-1).filter(i=>i>=0)}
function ownsGroup(pi,g){return groupTiles(g).every(i=>st.owners[i]&&st.owners[i].owner===pi)}
function rentAt(i,owner,level){const t=tiles()[i];let base=Math.round(t.p*(st.mode==='classic'?0.5:0.35)/10)*10;if(ownsGroup(owner,t.g))base*=2;return Math.round(base*LVMULT[level]/10)*10}
function rentOf(i){const o=st.owners[i];return rentAt(i,o.owner,o.level)}
function upCost(i){return tiles()[i].p/2}
function worth(pi){let w=st.players[pi].money;for(const i in st.owners){const o=st.owners[i];if(o.owner===pi)w+=tiles()[i].p+o.level*upCost(i)}return w}
function other(pi){return 1-pi}

function pay(pi,amt,to){
  const p=st.players[pi]; p.money-=amt; if(to!=null) st.players[to].money+=amt;
  if(p.money<0){
    const mine=Object.keys(st.owners).filter(i=>st.owners[i].owner===pi).sort((a,b)=>tiles()[b].p-tiles()[a].p);
    for(const i of mine){ if(p.money>=0) break; const v=tiles()[i].p/2+st.owners[i].level*upCost(i)/2; p.money+=v; delete st.owners[i]; log('sell',{n:p.name,ti:i,v}); }
    if(p.money<0){ st.phase='over'; st.winner=other(pi); log('bankrupt',{n:p.name}); }
  }
}
function applyFx(pi,fx){
  const p=st.players[pi], q=st.players[other(pi)], N=tiles().length;
  let mv=0, re=false;
  if(fx.money) { if(fx.money>0) p.money+=fx.money; else pay(pi,-fx.money,null); }
  if(fx.give) pay(other(pi),fx.give,pi);
  if(fx.lose) pay(pi,fx.lose,other(pi));
  if(fx.both){ p.money+=fx.both; q.money+=fx.both; }
  if(fx.jail) p.skip=1;
  if(fx.jailOther) q.skip=1;
  if(fx.boost) p.boost=1;
  if(fx.goto!=null){ p.pos=fx.goto; if(fx.goto===0) p.money+=200; }
  if(fx.gotoNoPay!=null){ p.pos=fx.gotoNoPay; }
  if(fx.teleport){ p.pos=rnd(N); re=true; }
  if(fx.gotoOpp){ p.pos=q.pos; re=true; }
  if(fx.swap){ const a=p.pos; p.pos=q.pos; q.pos=a; re=true; }
  if(fx.move) mv=fx.move;
  return {mv,re};
}
function land(pi,depth){
  const p=st.players[pi], i=p.pos, t=tiles()[i];
  st.pending=null;
  if(t.t==='prop'){
    const o=st.owners[i];
    if(!o){ if(p.money>=t.p){ st.pending={type:'buy',tile:i}; log('canBuy',{n:p.name,ti:i,p:t.p}); } else log('poor',{n:p.name,ti:i}); }
    else if(o.owner!==pi){ const r=rentOf(i); log('rent',{n:p.name,o:st.players[o.owner].name,ti:i,r}); pay(pi,r,o.owner); }
    else { if(ownsGroup(pi,t.g)&&o.level<3&&p.money>=upCost(i)){ st.pending={type:'up',tile:i}; log('canUp',{n:p.name,ti:i,c:upCost(i)}); } else log('back',{n:p.name,ti:i}); }
  } else if(t.t==='chance'){
    const ci=rnd(CARDS.length),c=CARDS[ci]; log('chance',{n:p.name,ci});
    const r=applyFx(pi,c.fx);
    if(st.phase==='over') return;
    if(r.mv&&depth<1){ p.pos=(p.pos+r.mv+tiles().length)%tiles().length; land(pi,depth+1); return; }
    if(r.re&&depth<1){ if(tiles()[p.pos].t!=='chance') land(pi,depth+1); return; }
  } else if(t.t==='tax'){ log('tax',{n:p.name,a:t.a}); pay(pi,t.a,null); }
  else if(t.t==='jail'){ p.skip=1; log('jail',{n:p.name}); }
  else if(t.t==='wheel'){ const wi=rnd(WHEEL.length),w=WHEEL[wi]; log('wheel',{n:p.name,wi}); applyFx(pi,w.fx); }
  else if(t.t==='rest'){ log('rest',{n:p.name}); }
  else if(t.t==='go'){ log('go',{n:p.name}); }
}
function endTurn(){
  st.step='roll'; st.pending=null; st.dice=[];
  let guard=0;
  do{
    st.turn=other(st.turn); if(st.turn===0) st.round++;
    if(cfg().maxRounds&&st.round>cfg().maxRounds){ st.phase='over'; const w0=worth(0),w1=worth(1); st.winner=w0===w1?null:(w0>w1?0:1); log('settle',{m:cfg().maxRounds,a:st.players[0].name,x:w0,b:st.players[1].name,y:w1}); return; }
    const p=st.players[st.turn];
    if(p.skip>0){ p.skip--; log('skip',{n:p.name}); guard++; continue; }
    break;
  }while(guard<3);
}

/* ---------- 網路同步（Claude 內用 storage，外部網頁用 WebRTC/PeerJS） ---------- */
const PFX='cmp-2p-';
let peer=null, conn=null;
const usePeer=()=>!hasStorage()&&typeof Peer!=='undefined';
const netOK=()=>hasStorage()||usePeer();
async function push(){
  if(!net.online) return; st.seq++;
  if(hasStorage()){ try{ await window.storage.set(key(),JSON.stringify(st),true); }catch(e){ console.error(e); } }
  else if(conn&&conn.open){ try{ conn.send(JSON.stringify(st)); }catch(e){ console.error(e); } }
}
async function pull(){
  if(!net.online||busy||!hasStorage()) return;
  try{ const r=await window.storage.get(key(),true); if(!r) return; const s=JSON.parse(r.value); if(s.seq>st.seq){ st=s; render(); } }catch(e){}
}
function startPolling(){ stopPolling(); if(hasStorage()) timer=setInterval(pull,2000); }
function stopPolling(){ if(timer) clearInterval(timer); timer=null; if(conn){ try{conn.close()}catch(e){} conn=null; } if(peer){ try{peer.destroy()}catch(e){} peer=null; } }
function onData(d){
  let m; try{ m=typeof d==='string'?JSON.parse(d):d; }catch(e){ return; }
  if(m.type==='join'){ if(!st||st.phase!=='lobby') return; st.players[1].name=m.name; st.guestJoined=true; render(); push(); return; }
  if(m.seq!=null && (!st||m.seq>st.seq)){ st=m; if(busy) return; render(); }
}
function onDisconnect(){ if(!net.online) return; $('home-err').textContent=T('e_disc'); goHome(); }
function hostPeer(){
  return new Promise((ok,fail)=>{
    let tries=0;
    const make=()=>{
      net.code=String(1000+rnd(9000)); st.code=net.code;
      peer=new Peer(PFX+net.code);
      peer.on('open',()=>ok());
      peer.on('error',e=>{ if(e.type==='unavailable-id'&&tries++<3){ peer.destroy(); make(); } else fail(e); });
      peer.on('connection',c=>{ conn=c; c.on('data',onData); c.on('close',onDisconnect); c.on('error',onDisconnect); });
    };
    make();
  });
}
function joinPeer(code,name){
  return new Promise((ok,fail)=>{
    let done=false;
    const t=setTimeout(()=>{ if(!done){ done=true; fail(new Error('timeout')); } },10000);
    peer=new Peer();
    peer.on('error',e=>{ if(!done){ done=true; clearTimeout(t); fail(e); } });
    peer.on('open',()=>{
      conn=peer.connect(PFX+code,{reliable:true});
      conn.on('open',()=>{ conn.send(JSON.stringify({type:'join',name})); });
      conn.on('data',d=>{ onData(d); if(!done&&st&&st.seq){ done=true; clearTimeout(t); ok(); } });
      conn.on('close',onDisconnect); conn.on('error',e=>{ if(!done){ done=true; clearTimeout(t); fail(e); } else onDisconnect(); });
    });
  });
}

/* ---------- 畫面 ---------- */
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $(id).classList.add('on'); }
function myTurn(){ return !net.online || st.turn===net.me; }

function render(){
  if(!st) return;
  if(st.phase==='lobby'){ renderLobby(); return; }
  show('s-game');
  const c=cfg();
  $('g-mode').textContent=T('m_'+st.mode)+'・'+(net.online?T('room')+' '+net.code:T('onePhone'));
  $('g-round').textContent=T('round',{r:Math.min(st.round,c.maxRounds),m:c.maxRounds});
  $('g-players').innerHTML=st.players.map((p,i)=>`<div class="pl ${st.turn===i&&st.phase==='play'?'turn':''}"><span class="dot p${i}"></span><div style="min-width:0"><div class="nm">${esc(p.name)}${net.online&&net.me===i?T('you'):''}</div><div class="money">$${p.money}</div><div class="worth">${T('worth')} $${worth(i)}${p.skip?'・'+T('skipping'):''}${p.boost?'・'+T('boosted'):''}</div></div></div>`).join('');
  renderBoard();
  renderPanel();
  $('log').innerHTML=st.log.map(l=>`<div>${logText(l)}</div>`).join('');
}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

function renderBoard(){
  const TT=tiles();
  const b=$('board'); b.className='board '+st.mode;
  let h='';
  TT.forEach((t,i)=>{
    const r=Math.floor(i/4), c=(r%2===0)?(i%4):(3-i%4);
    const o=st.owners[i]; const hot=st.players[st.turn].pos===i&&st.phase==='play';
    const cls=['tile',t.t!=='prop'?'corner':'',o?'own'+o.owner:'',hot?'hot':''].join(' ');
    const band=t.t==='prop'?`<div class="band" style="background:var(--g${t.g})"></div>`:'<div class="band" style="background:transparent"></div>';
    const sub=t.t==='prop'?(o?`<span class="lv">${'▲'.repeat(o.level)||'&nbsp;'}</span>`:`<span class="tp">$${t.p}</span>`):(t.t==='tax'?`<span class="tp">-$${t.a}</span>`:'');
    const tk=st.players.map((p,pi)=>p.pos===i?`<span class="tk p${pi}"></span>`:'').join('');
    h+=`<div class="${cls}" style="grid-row:${r+1};grid-column:${c+1}">${band}<span class="idx">${i+1}</span><span class="tn">${tileName(i)}</span>${sub}${tk}</div>`;
  });
  b.innerHTML=h;
  renderDice();
}
function renderDice(){
  const d=(st.dice.length?st.dice:Array(cfg().dice).fill(0));
  $('dice').innerHTML=d.map(x=>`<div class="die ${busy?'roll':''}">${x?FACES[x-1]:'·'}</div>`).join('');
}

function renderPanel(){
  const say=$('say'), act=$('actions'), over=$('over');
  over.innerHTML='';
  if(st.phase==='over'){
    $('panel').style.display='none';
    const w=st.winner;
    over.innerHTML=`<div class="over"><h2>${w==null?T('draw'):T('wins',{n:st.players[w].name})}</h2><p>${w==null?T('drawSub'):T('winSub')}</p>
      <div class="stack">${(!net.online||net.me===0)?`<button class="primary" id="b-again">${T('again')}</button>`:`<p class="sub" style="margin:0;color:var(--ink-soft)">${T('hostAgain')}</p>`}<button class="ghost" id="b-home" style="color:var(--ink);border-color:var(--paper-dim)">${T('home')}</button></div></div>`;
    const ag=$('b-again'); if(ag) ag.onclick=again;
    $('b-home').onclick=goHome;
    return;
  }
  $('panel').style.display='';
  const p=st.players[st.turn];
  if(!myTurn()){ say.innerHTML=T('waitTurn',{n:p.name}); act.innerHTML=''; return; }
  if(st.step==='moving'){ say.innerHTML=T('moving'); act.innerHTML=''; return; }
  if(st.step==='roll'){
    say.innerHTML=net.online?T('yourTurn',{n:p.name}):T('passPhone',{n:p.name});
    act.innerHTML=`<button class="primary wide" id="b-roll">${T('roll')}</button>`;
    $('b-roll').onclick=roll;
  } else if(st.pending&&st.pending.type==='buy'){
    const t=tiles()[st.pending.tile];
    say.innerHTML=T('buyQ',{t:tileName(st.pending.tile),p:t.p});
    act.innerHTML=`<button class="primary" id="b-yes">${T('buy')}</button><button id="b-no">${T('noBuy')}</button>`;
    $('b-yes').onclick=()=>{ st.owners[st.pending.tile]={owner:st.turn,level:0}; pay(st.turn,t.p,null); log('bought',{n:p.name,ti:st.pending.tile}); st.pending=null; finish(); };
    $('b-no').onclick=()=>{ st.pending=null; finish(); };
  } else if(st.pending&&st.pending.type==='up'){
    const i=st.pending.tile,t=tiles()[i];
    say.innerHTML=T('upQ',{t:tileName(i),c:upCost(i),a:rentOf(i),b:rentAt(i,st.turn,st.owners[i].level+1)});
    act.innerHTML=`<button class="primary" id="b-yes">${T('up')}</button><button id="b-no">${T('noUp')}</button>`;
    $('b-yes').onclick=()=>{ pay(st.turn,upCost(i),null); st.owners[i].level++; log('upgraded',{n:p.name,ti:i,l:st.owners[i].level}); st.pending=null; finish(); };
    $('b-no').onclick=()=>{ st.pending=null; finish(); };
  } else {
    say.innerHTML=st.log[0]?logText(st.log[0]):'';
    act.innerHTML=`<button class="primary wide" id="b-end">${T('end')}</button>`;
    $('b-end').onclick=()=>{ endTurn(); render(); push(); };
  }
}
function finish(){ if(st.phase==='over'){ render(); push(); return; } st.step='end'; render(); push(); }

async function roll(){
  if(busy) return; busy=true;
  const c=cfg(), p=st.players[st.turn], TT=tiles();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const d=Array.from({length:c.dice},()=>1+rnd(6)); st.dice=d; st.step='moving'; render();
  if(!reduce){ // 骰子亂跳一下
    for(let k=0;k<5;k++){ st.dice=d.map(()=>1+rnd(6)); renderBoard(); await sleep(90); }
    st.dice=d; renderBoard(); await sleep(250);
  }
  let steps=d.reduce((a,b)=>a+b,0);
  if(p.boost){ p.boost=0; steps*=2; log('boost',{n:p.name,s:steps}); } else log('roll',{n:p.name,s:steps});
  for(let k=0;k<steps;k++){ p.pos=(p.pos+1)%TT.length; if(p.pos===0){ p.money+=200; log('passGo',{n:p.name}); } if(!reduce){ renderBoard(); await sleep(140); } }
  busy=false;
  land(st.turn,0);
  if(st.phase==='over'){ render(); push(); return; }
  st.step=st.pending?'decide':'end';
  render(); push();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- 大廳 / 流程 ---------- */
let homeConn='online', homeMode='quick';
document.querySelectorAll('#seg-conn button').forEach(b=>b.onclick=()=>{ homeConn=b.dataset.v; document.querySelectorAll('#seg-conn button').forEach(x=>x.classList.toggle('sel',x===b)); $('joincode').parentElement.style.display=homeConn==='online'?'':'none'; $('home-note').style.display=homeConn==='online'?'':'none'; $('f-name2').style.display=homeConn==='online'?'none':''; $('b-create').textContent=homeConn==='online'?T('create'):T('startLocal'); });
document.querySelectorAll('#seg-lang button').forEach(b=>b.onclick=()=>{ lang=b.dataset.v; applyLang(); });
$('b-lang').onclick=()=>{ lang=lang==='ja'?'zh':'ja'; applyLang(); };
document.querySelectorAll('#seg-mode button').forEach(b=>b.onclick=()=>{ homeMode=b.dataset.v; document.querySelectorAll('#seg-mode button').forEach(x=>x.classList.toggle('sel',x===b)); });

$('b-create').onclick=async()=>{
  const name=$('myname').value.trim(); $('home-err').textContent='';
  if(homeConn==='local'){
    net={online:false,code:'',me:0};
    const n2=$('name2').value.trim()||(lang==='ja'?'プレイヤー2':'玩家二');
    st=newState(homeMode,[name||(lang==='ja'?'プレイヤー1':'玩家一'),n2]); st.phase='play'; log('start'); render(); return;
  }
  if(!netOK()){ $('home-err').textContent=T('e_storage'); return; }
  if(!name){ $('home-err').textContent=T('e_name'); return; }
  net={online:true,code:String(1000+rnd(9000)),me:0};
  st=newState(homeMode,[name,'']);
  $('b-create').disabled=true; $('home-err').textContent=T('connecting');
  try{
    if(hasStorage()) await window.storage.set(key(),JSON.stringify(st),true);
    else await hostPeer();
  }catch(e){ $('home-err').textContent=T('e_create'); $('b-create').disabled=false; stopPolling(); return; }
  $('b-create').disabled=false; $('home-err').textContent='';
  render(); startPolling();
};
$('b-join').onclick=async()=>{
  const name=$('myname').value.trim(), code=$('joincode').value.trim(); $('home-err').textContent='';
  if(!netOK()){ $('home-err').textContent=T('e_storage'); return; }
  if(!name){ $('home-err').textContent=T('e_name'); return; }
  if(!/^\d{4}$/.test(code)){ $('home-err').textContent=T('e_code'); return; }
  net={online:true,code,me:1};
  $('b-join').disabled=true; $('home-err').textContent=T('connecting');
  if(hasStorage()){
    let s=null;
    try{ const r=await window.storage.get(key(),true); s=JSON.parse(r.value); }catch(e){}
    $('b-join').disabled=false;
    if(!s){ $('home-err').textContent=T('e_notfound'); return; }
    if(s.guestJoined&&s.phase!=='lobby'){ $('home-err').textContent=T('e_started'); return; }
    s.players[1].name=name; s.guestJoined=true; st=s; await push();
  } else {
    st=null;
    try{ await joinPeer(code,name); }
    catch(e){ $('b-join').disabled=false; stopPolling(); net.online=false; $('home-err').textContent=T('e_notfound'); return; }
    $('b-join').disabled=false;
    if(st.phase!=='lobby'){ $('home-err').textContent=T('e_started'); stopPolling(); net.online=false; return; }
  }
  $('home-err').textContent='';
  render(); startPolling();
};
$('b-start').onclick=async()=>{ st.phase='play'; log('start'); render(); await push(); };
$('b-leave').onclick=goHome;

function renderLobby(){
  show('s-lobby'); $('lobby-code').textContent=net.code;
  if(net.me===0){
    $('lobby-status').textContent=st.guestJoined?T('joined',{n:st.players[1].name}):T('waiting');
    $('b-start').style.display=''; $('b-start').disabled=!st.guestJoined;
  } else { $('lobby-status').textContent=T('guestWait',{n:st.players[0].name}); $('b-start').style.display='none'; }
}
function again(){
  const names=st.players.map(p=>p.name), seq=st.seq;
  st=newState(st.mode,names); st.seq=seq; st.phase='play'; st.guestJoined=true; log('again');
  render(); push();
}
function goHome(){ stopPolling(); st=null; net={online:false,code:'',me:0}; show('s-home'); applyLang(); }
applyLang();
</script>
