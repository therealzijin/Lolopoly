<!doctype html>
<html lang="zh-Hant" id="html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>兩人大富翁</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
:root{
  --felt:#234B48; --felt-dark:#1B3B39; --felt-line:#2F5F5B;
  --paper:#FFF4DE; --paper-dim:#EFE2C8; --ink:#2B2420; --ink-soft:#6B5F58;
  --p0:#FF6B57; --p1:#4D9DE0; --p2:#7ED321; --p3:#B57BEE; --gold:#F2C14E;
  --g粉:#F7A1C4; --g橘:#FFA25B; --g黃:#F2D45C; --g綠:#7ED3A3; --g藍:#7FB6F0; --g紫:#C39BF2; --g金:#F2C14E;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,"PingFang TC","Hiragino Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--felt);
  background-image:radial-gradient(circle at 50% 0%,#2C5B57 0,var(--felt) 55%,var(--felt-dark) 100%);
  color:var(--paper); min-height:100%; padding:14px 12px 24px; max-width:520px; margin:0 auto;
}
button{font:inherit;border:0;border-radius:14px;padding:13px 16px;font-weight:700;cursor:pointer;color:var(--ink);background:var(--paper)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold)}
button.ghost{background:transparent;color:var(--paper);border:2px solid var(--felt-line)}
input{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--felt-line);background:var(--felt-dark);color:var(--paper);font-size:17px}
input:focus{outline:none;border-color:var(--gold)}
.screen{display:none}.screen.on{display:block}
h1{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.01em;margin:8px 0 4px}
.sub{color:#BFD3CF;font-size:15px;line-height:1.5;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;color:#BFD3CF;margin-bottom:6px}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;background:var(--felt-dark);color:var(--paper);border:2px solid var(--felt-line);padding:12px 8px;border-radius:12px}
.seg button.sel{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.seg small{display:block;font-weight:500;font-size:12px;opacity:.75;margin-top:2px}
.stack{display:grid;gap:10px;margin-top:8px}
.note{font-size:13px;color:#BFD3CF;line-height:1.5;margin-top:14px}
.code{font-size:56px;font-weight:800;letter-spacing:.12em;text-align:center;margin:18px 0 6px;color:var(--gold)}
.center{text-align:center}
.err{color:#FFB4A8;font-size:14px;margin-top:8px;min-height:1.2em}

/* game */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;color:#BFD3CF}
.players{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:10px}
.pl{background:var(--felt-dark);border-radius:12px;padding:7px 10px;border:2px solid transparent;display:flex;align-items:center;gap:10px}
.pl.turn{border-color:var(--paper)}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;border:3px solid;flex:none;background:#0f2422}
.av.p0{border-color:var(--p0)} .av.p1{border-color:var(--p1)} .av.p2{border-color:var(--p2)} .av.p3{border-color:var(--p3)}
.pl.out{opacity:.45}
.badge{display:inline-block;font-size:9px;font-weight:800;background:var(--felt-line);color:var(--paper);border-radius:5px;padding:1px 5px;margin-left:4px;vertical-align:middle}
.pl .info{flex:1;min-width:0}
.pl .nm{font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .nm .ch{font-weight:500;color:#BFD3CF;font-size:12px}
.pl .skill{font-size:10.5px;color:#BFD3CF;line-height:1.25;margin-top:2px}
.pl .right{flex:none;text-align:right}
.pl .money{font-size:18px;font-weight:800;line-height:1.1}
.pl .cnt{font-size:12px;color:#BFD3CF;line-height:1.2;margin-top:2px}
.pl .cnt b{color:var(--paper)}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,244,222,.9);transform:scale(1)}50%{box-shadow:0 0 0 7px rgba(255,244,222,0);transform:scale(1.08)}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none;box-shadow:0 0 0 3px var(--gold)}}
.board{display:grid;width:100%;gap:5px}
.tile{position:relative;background:var(--paper);border-radius:9px;overflow:hidden;display:flex;flex-direction:column;align-items:center;color:var(--ink);min-width:0;padding-bottom:22px}
.board.snake.quick .tile{min-height:92px} .board.snake.classic .tile{min-height:66px}
.board.ring.quick .tile{min-height:70px} .board.ring.classic .tile{min-height:52px}
.tile .band{width:100%;height:8px;flex:none}
.tile .idx{position:absolute;top:10px;left:5px;font-size:9px;color:var(--ink-soft);opacity:.7}
.tile .tn{font-size:14px;font-weight:800;line-height:1.15;text-align:center;padding:6px 4px 0;word-break:break-all}
.tile .tp{font-size:13px;color:var(--ink-soft);line-height:1.2;margin-top:2px;font-weight:600}
.tile .lv{font-size:12px;line-height:1.2;margin-top:2px;letter-spacing:1px}
.board.classic .tile .tn{font-size:11.5px;padding-top:4px} .board.classic .tile .tp,.board.classic .tile .lv{font-size:11px}
.board.ring.classic .tile .tn{font-size:10px} .board.ring.classic .tile .tp,.board.ring.classic .tile .lv{font-size:10px}
.tile.corner{background:var(--paper-dim)}
.tile.own0{box-shadow:inset 0 0 0 3px var(--p0);background:#FFE7E2} .tile.own1{box-shadow:inset 0 0 0 3px var(--p1);background:#E2EEFB} .tile.own2{box-shadow:inset 0 0 0 3px var(--p2);background:#EAF7DB} .tile.own3{box-shadow:inset 0 0 0 3px var(--p3);background:#F0E6FB}
.tile.own0 .band{background:var(--p0)!important} .tile.own1 .band{background:var(--p1)!important} .tile.own2 .band{background:var(--p2)!important} .tile.own3 .band{background:var(--p3)!important}
.tile.own0 .lv{color:#B3321F} .tile.own1 .lv{color:#1F5FA8} .tile.own2 .lv{color:#3F7A12} .tile.own3 .lv{color:#6A3AA8}
.tile.hot{box-shadow:inset 0 0 0 3px var(--gold)}
.tk{position:absolute;bottom:3px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tk.p0{background:var(--p0)} .tk.p1{background:var(--p1)} .tk.p2{background:var(--p2)} .tk.p3{background:var(--p3)}
.tk.s0{left:3px} .tk.s1{left:26px} .tk.s2{right:26px} .tk.s3{right:3px}
.rank{list-style:none;text-align:left;margin:0 auto 14px;max-width:260px}.rank li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--paper-dim);font-size:15px}.rank li b{color:var(--ink)}
.die{width:48px;height:48px;border-radius:10px;background:var(--paper);color:var(--ink);font-size:40px;line-height:48px;font-weight:800;text-align:center}
.die.roll{animation:shake .5s linear infinite}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}100%{transform:rotate(0)}}
@media(prefers-reduced-motion:reduce){.die.roll{animation:none}}
.tile .dir{position:absolute;top:8px;right:4px;font-size:12px;font-weight:800;color:var(--ink-soft);line-height:1}
.tile .dir.turn{color:var(--ink);font-size:14px}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;color:var(--paper);font-size:14px;line-height:1.4}
.mid b{color:var(--gold)}
.mid .last{font-size:12px;color:#BFD3CF;margin-top:6px}
.panel{margin-top:12px;background:var(--felt-dark);border-radius:16px;padding:12px 14px}
.panel .say{font-size:15px;line-height:1.45;min-height:1.4em;margin-bottom:10px}
.panel .say b{color:var(--gold)}
.controls{display:flex;gap:10px;align-items:center}
.dice{display:flex;gap:6px;flex:none}
.actions{display:grid;gap:8px;grid-template-columns:1fr 1fr;flex:1}
.actions button{padding:13px 8px}
.actions button.wide{grid-column:1/-1}
.log{margin-top:12px;font-size:13px;line-height:1.55;color:#BFD3CF;max-height:150px;overflow:auto;padding-right:4px}
.log div{padding:2px 0;border-bottom:1px dashed var(--felt-line)}
.log div:first-child{color:var(--paper)}
.over{background:var(--paper);color:var(--ink);border-radius:18px;padding:22px 18px;text-align:center;margin-top:12px}
.over h2{font-size:28px;font-weight:800;margin-bottom:6px}
.over p{color:var(--ink-soft);font-size:15px;line-height:1.5;margin-bottom:14px}
</style>
</head>
<body>

<!-- 首頁 -->
<section id="s-home" class="screen on">
  <div class="seg" id="seg-lang" style="max-width:220px;margin-bottom:6px">
    <button data-v="zh">中文</button><button data-v="ja">日本語</button>
  </div>
  <h1 data-i="title"></h1>
  <p class="sub" data-i="sub"></p>

  <div class="field"><label for="myname" data-i="myname"></label><input id="myname" maxlength="8" data-ph="myname_ph" autocomplete="off"></div>
  <div class="field" id="f-name2" style="display:none"><label for="name2" data-i="name2"></label><input id="name2" maxlength="8" data-ph="name2_ph" autocomplete="off"></div>

  <div class="field"><label data-i="how"></label>
    <div class="seg" id="seg-conn">
      <button data-v="online" class="sel"><span data-i="online"></span><small data-i="online_s"></small></button>
      <button data-v="local"><span data-i="local"></span><small data-i="local_s"></small></button>
    </div>
  </div>

  <div class="field"><label data-i="layout"></label>
    <div class="seg" id="seg-layout">
      <button data-v="ring"><span data-i="ring"></span><small data-i="ring_s"></small></button>
      <button data-v="snake"><span data-i="snake"></span><small data-i="snake_s"></small></button>
    </div>
  </div>

  <div class="field"><label data-i="npc"></label>
    <div class="seg" id="seg-npc">
      <button data-v="0" class="sel">0</button><button data-v="1">1</button><button data-v="2">2</button>
    </div>
    <p class="note" style="margin-top:6px" data-i="npc_s"></p>
  </div>

  <div class="field" id="f-mode"><label data-i="mode"></label>
    <div class="seg" id="seg-mode">
      <button data-v="quick" class="sel"><span data-i="quick"></span><small data-i="quick_s"></small></button>
      <button data-v="classic"><span data-i="classic"></span><small data-i="classic_s"></small></button>
    </div>
  </div>

  <div class="stack">
    <button class="primary" id="b-create"></button>
    <div class="seg" style="margin:0"><input id="joincode" inputmode="numeric" maxlength="4" data-ph="code_ph" style="flex:1"><button id="b-join" style="flex:none" data-i="join"></button></div>
    <div class="err" id="home-err"></div>
  </div>
  <p class="note" id="home-note" data-i="note"></p>
</section>

<!-- 大廳 -->
<section id="s-lobby" class="screen">
  <h1 data-i="lobby_title"></h1>
  <p class="sub" data-i="lobby_sub"></p>
  <div class="code" id="lobby-code">0000</div>
  <p class="center sub" id="lobby-status"></p>
  <div class="stack">
    <button class="primary" id="b-start" disabled data-i="start"></button>
    <button class="ghost" id="b-leave" data-i="leave"></button>
  </div>
</section>

<!-- 遊戲 -->
<section id="s-game" class="screen">
  <div class="topbar"><span id="g-mode"></span><span id="g-round"></span><span><button class="ghost" id="b-layout" style="padding:4px 8px;border-radius:8px;font-size:12px;margin-right:6px"></button><button class="ghost" id="b-lang" style="padding:4px 8px;border-radius:8px;font-size:12px"></button></span></div>
  <div class="players" id="g-players"></div>
  <div class="board" id="board"></div>
  <div class="panel" id="panel">
    <div class="say" id="say"></div>
    <div class="controls"><div class="dice" id="dice"></div><div class="actions" id="actions"></div></div>
  </div>
  <div id="over"></div>
  <div class="log" id="log"></div>
</section>

/* ---------- 狀態 ---------- */
let st=null;            // 共享遊戲狀態
let net={online:false,code:'',me:0};
let timer=null, busy=false;
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const hasStorage=()=>typeof window.storage!=='undefined' && window.storage && window.storage.get;
const key=()=> 'room:'+net.code;

function newState(mode,names,npc){
  const c=CFG[mode];
  const players=[{name:names[0]||'玩家一',money:c.start,pos:0,skip:0,ch:0,npc:false,out:false},{name:names[1]||'玩家二',money:c.start+100,pos:0,skip:0,ch:1,npc:false,out:false}];
  for(let k=0;k<(npc||0);k++) players.push({name:'@npc'+k,npcId:k,money:c.start+100+50*k,pos:0,skip:0,ch:2+k,npc:true,out:false});
  return {
    mode, phase:'lobby', seq:1, code:net.code, guestJoined:false, npc:npc||0,
    players,
    owners:{}, turn:0, round:1, step:'roll', pending:null, dice:[], winner:null, log:[]
  };
}
function tiles(){return TILES[st.mode]}
function assignCh(){const pool=CH.map((_,i)=>i); st.players.forEach(p=>{ p.ch=pool.splice(rnd(pool.length),1)[0]; });}
function logPicks(){ st.players.forEach(p=>log('pick',{n:p.name,chi:p.ch})); }
function cfg(){return CFG[st.mode]}
function log(k,p){st.log.unshift({k,p}); if(st.log.length>30) st.log.length=30;}
function groupTiles(g){return tiles().map((t,i)=>t.g===g?i:-1).filter(i=>i>=0)}
function ownsGroup(pi,g){return groupTiles(g).every(i=>st.owners[i]&&st.owners[i].owner===pi)}
function rentAt(i,owner,level){const t=tiles()[i];let base=Math.round(t.p*(st.mode==='classic'?0.5:0.35)/10)*10;if(ownsGroup(owner,t.g))base*=2;return Math.round(base*LVMULT[level]/10)*10}
function rentOf(i){const o=st.owners[i];return rentAt(i,o.owner,o.level)}
function upCost(i,pi){const c=tiles()[i].p/2; return (pi!=null&&has(pi,'lulu'))?Math.round(c*0.5/10)*10:c;}
function worth(pi){let w=st.players[pi].money;for(const i in st.owners){const o=st.owners[i];if(o.owner===pi)w+=tiles()[i].p+o.level*(tiles()[i].p/2)}return w}
function active(){return st.players.map((p,i)=>p.out?-1:i).filter(i=>i>=0)}
function other(pi){let best=-1,bw=-Infinity; st.players.forEach((q,i)=>{ if(i!==pi&&!q.out){ const w=worth(i); if(w>bw){bw=w;best=i;} } }); return best<0?pi:best;}
function pname(pi){return npcName(st.players[pi].name);}

function pay(pi,amt,to){
  const p=st.players[pi]; p.money-=amt; if(to!=null) st.players[to].money+=amt;
  if(p.money<0){
    const mine=Object.keys(st.owners).filter(i=>st.owners[i].owner===pi).sort((a,b)=>tiles()[b].p-tiles()[a].p);
    for(const i of mine){ if(p.money>=0) break; const v=tiles()[i].p/2+st.owners[i].level*upCost(i)/2; p.money+=v; delete st.owners[i]; log('sell',{n:p.name,ti:i,v}); }
    if(p.money<0){ p.money=0; p.out=true; log('bankrupt',{n:p.name}); const a=active(); if(a.length<=1){ st.phase='over'; st.winner=a.length?a[0]:null; st.ranking=a.map(i=>({i,w:worth(i)})); } }
  }
}
function applyFx(pi,fx){
  const p=st.players[pi], q=st.players[other(pi)], N=tiles().length;
  let mv=0, re=false;
  if(fx.money) { if(fx.money>0) p.money+=fx.money; else pay(pi,has(pi,'bard')?Math.round(-fx.money/2/10)*10:-fx.money,null); }
  if(fx.give) pay(other(pi),fx.give,pi);
  if(fx.lose) pay(pi,fx.lose,other(pi));
  if(fx.both){ st.players.forEach(x=>{ if(!x.out) x.money+=fx.both; }); }
  if(fx.jail){ if(has(pi,'sion')) log('immune',{n:p.name}); else p.skip=1; }
  if(fx.jailOther) q.skip=1;
  if(fx.boost) p.boost=1;
  if(fx.goto!=null){ p.pos=fx.goto; if(fx.goto===0) p.money+=goBonus(pi); }
  if(fx.gotoNoPay!=null){ p.pos=fx.gotoNoPay; }
  if(fx.teleport){ p.pos=rnd(N); re=true; }
  if(fx.gotoOpp){ p.pos=q.pos; re=true; }
  if(fx.swap){ const a=p.pos; p.pos=q.pos; q.pos=a; re=true; }
  if(fx.move) mv=fx.move;
  return {mv,re};
}
function land(pi,depth){
  const p=st.players[pi], i=p.pos, t=tiles()[i];
  st.pending=null;
  if(t.t==='prop'){
    const o=st.owners[i];
    if(!o){ if(p.money>=buyPrice(i,pi)){ st.pending={type:'buy',tile:i}; log('canBuy',{n:p.name,ti:i,p:buyPrice(i,pi)}); } else log('poor',{n:p.name,ti:i}); }
    else if(o.owner!==pi){ let r=rentOf(i); if(has(o.owner,'teemo')) r*=1.5; if(has(pi,'singed')) r*=0.7; r=Math.round(r/10)*10; if(has(pi,'sion')) r=Math.min(r,250); log('rent',{n:p.name,o:st.players[o.owner].name,ti:i,r}); pay(pi,r,o.owner); }
    else { if(ownsGroup(pi,t.g)&&o.level<3&&p.money>=upCost(i,pi)){ st.pending={type:'up',tile:i}; log('canUp',{n:p.name,ti:i,c:upCost(i,pi)}); } else log('back',{n:p.name,ti:i}); }
  } else if(t.t==='chance'){
    const ci=rnd(CARDS.length),c=CARDS[ci]; log('chance',{n:p.name,ci});
    const r=applyFx(pi,c.fx);
    if(st.phase==='over') return;
    if(r.mv&&depth<1){ p.pos=(p.pos+r.mv+tiles().length)%tiles().length; land(pi,depth+1); return; }
    if(r.re&&depth<1){ if(tiles()[p.pos].t!=='chance') land(pi,depth+1); return; }
  } else if(t.t==='tax'){ const a=has(pi,'lulu')?t.a/2:t.a; log('tax',{n:p.name,a}); pay(pi,a,null); }
  else if(t.t==='jail'){ if(has(pi,'sion')){ p.money+=80; log('immune',{n:p.name}); } else { p.skip=1; log('jail',{n:p.name}); } }
  else if(t.t==='wheel'){ let wi=rnd(WHEEL.length); if(has(pi,'bard')){ const good=WHEEL.map((w,k)=>(w.fx.money>0||w.fx.give)?k:-1).filter(k=>k>=0); wi=good[rnd(good.length)]; } const w=WHEEL[wi]; log('wheel',{n:p.name,wi}); applyFx(pi,w.fx); }
  else if(t.t==='rest'){ log('rest',{n:p.name}); }
  else if(t.t==='go'){ log('go',{n:p.name}); }
}
function endTurn(){
  st.step='roll'; st.pending=null; st.dice=[];
  if(st.phase==='over') return;
  const n=st.players.length; let guard=0;
  while(guard<n*2){
    guard++;
    st.turn=(st.turn+1)%n;
    if(st.turn===0){
      st.round++;
      if(cfg().maxRounds&&st.round>cfg().maxRounds){ settle(); return; }
    }
    const p=st.players[st.turn];
    if(p.out) continue;
    if(p.skip>0){ p.skip--; log('skip',{n:p.name}); continue; }
    if(has(st.turn,'yuumi')){ p.money+=10; log('heal',{n:p.name}); }
    return;
  }
}
function settle(){
  st.phase='over';
  const a=active(); const ws=a.map(i=>({i,w:worth(i)})).sort((x,y)=>y.w-x.w);
  st.winner=(ws.length>1&&ws[0].w===ws[1].w)?null:ws[0].i;
  st.ranking=ws;
  log('settle',{m:cfg().maxRounds,r:ws.map(x=>`${npcName(st.players[x.i].name)} $${x.w}`).join('、')});
}

/* ---------- 網路同步（Claude 內用 storage，外部網頁用 WebRTC/PeerJS） ---------- */
const PFX='cmp-2p-';
let peer=null, conn=null;
const usePeer=()=>!hasStorage()&&typeof Peer!=='undefined';
const netOK=()=>hasStorage()||usePeer();
async function push(){
  if(!net.online) return; st.seq++;
  if(hasStorage()){ try{ await window.storage.set(key(),JSON.stringify(st),true); }catch(e){ console.error(e); } }
  else if(conn&&conn.open){ try{ conn.send(JSON.stringify(st)); }catch(e){ console.error(e); } }
}
async function pull(){
  if(!net.online||busy||!hasStorage()) return;
  try{ const r=await window.storage.get(key(),true); if(!r) return; const s=JSON.parse(r.value); if(s.seq>st.seq){ st=s; render(); } }catch(e){}
}
function startPolling(){ stopPolling(); if(hasStorage()) timer=setInterval(pull,2000); }
function stopPolling(){ if(timer) clearInterval(timer); timer=null; if(conn){ try{conn.close()}catch(e){} conn=null; } if(peer){ try{peer.destroy()}catch(e){} peer=null; } }
function onData(d){
  let m; try{ m=typeof d==='string'?JSON.parse(d):d; }catch(e){ return; }
  if(m.type==='join'){ if(!st||st.phase!=='lobby') return; st.players[1].name=m.name; st.guestJoined=true; render(); push(); return; }
  if(m.seq!=null && (!st||m.seq>st.seq)){ st=m; if(busy) return; render(); }
}
function onDisconnect(){ if(!net.online) return; $('home-err').textContent=T('e_disc'); goHome(); }
function hostPeer(){
  return new Promise((ok,fail)=>{
    let tries=0;
    const make=()=>{
      net.code=String(1000+rnd(9000)); st.code=net.code;
      peer=new Peer(PFX+net.code);
      peer.on('open',()=>ok());
      peer.on('error',e=>{ if(e.type==='unavailable-id'&&tries++<3){ peer.destroy(); make(); } else fail(e); });
      peer.on('connection',c=>{ conn=c; c.on('data',onData); c.on('close',onDisconnect); c.on('error',onDisconnect); });
    };
    make();
  });
}
function joinPeer(code,name){
  return new Promise((ok,fail)=>{
    let done=false;
    const t=setTimeout(()=>{ if(!done){ done=true; fail(new Error('timeout')); } },10000);
    peer=new Peer();
    peer.on('error',e=>{ if(!done){ done=true; clearTimeout(t); fail(e); } });
    peer.on('open',()=>{
      conn=peer.connect(PFX+code,{reliable:true});
      conn.on('open',()=>{ conn.send(JSON.stringify({type:'join',name})); });
      conn.on('data',d=>{ onData(d); if(!done&&st&&st.seq){ done=true; clearTimeout(t); ok(); } });
      conn.on('close',onDisconnect); conn.on('error',e=>{ if(!done){ done=true; clearTimeout(t); fail(e); } else onDisconnect(); });
    });
  });
}

/* ---------- 畫面 ---------- */
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $(id).classList.add('on'); }
function isNpc(pi){return !!st.players[pi].npc}
function myTurn(){ if(isNpc(st.turn)) return false; return !net.online || st.turn===net.me; }
function npcRunner(){ return !net.online || net.me===0; }

function render(){
  if(!st) return;
  if(st.phase==='lobby'){ renderLobby(); return; }
  show('s-game');
  const c=cfg();
  $('g-mode').textContent=T('m_'+st.mode)+'・'+(net.online?T('room')+' '+net.code:T('onePhone'));
  $('g-round').textContent=T('round',{r:Math.min(st.round,c.maxRounds),m:c.maxRounds});
  $('g-players').innerHTML=st.players.map((p,i)=>{const ch=CH[p.ch], on=st.turn===i&&st.phase==='play';
    return `<div class="pl ${on?'turn':''} ${p.out?'out':''}"><div class="av p${i} ${on?'pulse':''}">${ch.e}</div><div class="info"><div class="nm">${esc(pname(i))}${net.online&&net.me===i?T('you'):''}${p.npc?`<span class="badge">${T('npcTag')}</span>`:''} <span class="ch">${ch.n[lang]}</span></div><div class="skill">${ch.d[lang]}${p.skip?'・'+T('skipping'):''}${p.boost?'・'+T('boosted'):''}</div></div><div class="right"><div class="money">$${p.money}</div><div class="cnt">${T('props')} <b>${propCount(i)}</b>・${T('worth')} $${worth(i)}</div></div></div>`;}).join('');
  renderBoard();
  renderPanel();
  $('log').innerHTML=st.log.map(l=>`<div>${logText(l)}</div>`).join('');
  scheduleNpc();
}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

const RING={quick:{cols:4,rows:8},classic:{cols:6,rows:12}};
const snakeCols=()=>st.mode==='quick'?3:4;
function cellOf(i){
  if(layout==='snake'){ const n=snakeCols(), r=Math.floor(i/n), c=(r%2===0)?(i%n):(n-1-i%n); return {r,c}; }
  const {cols,rows}=RING[st.mode];
  if(i<cols) return {r:0,c:i};
  if(i<cols+rows-2) return {r:i-cols+1,c:cols-1};
  if(i<2*cols+rows-2){ const k=i-(cols+rows-2); return {r:rows-1,c:cols-1-k}; }
  const k=i-(2*cols+rows-2); return {r:rows-2-k,c:0};
}
function dirOf(i,N){
  if(layout==='snake'){
    if(i===N-1) return ['↺',true];
    const n=snakeCols(), r=Math.floor(i/n), last=(i%n===n-1);
    if(last) return ['↓',true];
    return [r%2===0?'→':'←',false];
  }
  const {cols,rows}=RING[st.mode];
  if(i===N-1) return ['↑',false];
  if(i===cols-1) return ['↓',true];
  if(i===cols+rows-2) return ['←',true];
  if(i===2*cols+rows-3) return ['↑',true];
  if(i<cols-1) return ['→',false];
  if(i<cols+rows-2) return ['↓',false];
  if(i<2*cols+rows-2) return ['←',false];
  return ['↑',false];
}
function renderBoard(){
  const TT=tiles(), N=TT.length;
  const b=$('board'); b.className='board '+layout+' '+st.mode;
  const cols=layout==='snake'?snakeCols():RING[st.mode].cols, rows=layout==='snake'?Math.ceil(N/snakeCols()):RING[st.mode].rows;
  b.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  let h='';
  TT.forEach((t,i)=>{
    const {r,c}=cellOf(i);
    const o=st.owners[i]; const hot=st.players[st.turn].pos===i&&st.phase==='play';
    const cls=['tile',t.t!=='prop'?'corner':'',o?'own'+o.owner:'',hot?'hot':''].join(' ');
    const band=t.t==='prop'?`<div class="band" style="background:var(--g${t.g})"></div>`:'<div class="band" style="background:transparent"></div>';
    const sub=t.t==='prop'?(o?`<span class="lv">${'▲'.repeat(o.level)||'&nbsp;'}</span>`:`<span class="tp">$${t.p}</span>`):(t.t==='tax'?`<span class="tp">-$${t.a}</span>`:'');
    const tk=st.players.map((p,pi)=>(p.pos===i&&!p.out)?`<span class="tk p${pi} s${pi} ${st.turn===pi&&st.phase==='play'?'pulse':''}">${CH[p.ch].e}</span>`:'').join('');
    const [ar,turn]=dirOf(i,N);
    h+=`<div class="${cls}" style="grid-row:${r+1};grid-column:${c+1}">${band}<span class="idx">${i+1}</span><span class="dir ${turn?'turn':''}">${ar}</span><span class="tn">${tileName(i)}</span>${sub}${tk}</div>`;
  });
  if(layout==='ring'){
    const cur=st.players[st.turn];
    const msg=st.phase==='over'?`<b>${T('over')}</b>`:(myTurn()?T('turnOf',{n:pname(st.turn)}):T('waitFor',{n:pname(st.turn)}));
    const last=st.log[0]?`<div class="last">${logText(st.log[0])}</div>`:'';
    h+=`<div class="mid" style="grid-row:2/${rows};grid-column:2/${cols}">${msg}${last}</div>`;
  }
  b.innerHTML=h;
  renderDice();
}
function renderDice(){
  const d=(st.dice.length?st.dice:Array(cfg().dice).fill(0));
  $('dice').innerHTML=d.map(x=>`<div class="die ${busy?'roll':''}">${x?FACES[x-1]:'·'}</div>`).join('');
}

function actBuy(yes){
  const i=st.pending.tile, p=st.players[st.turn];
  if(yes){ const bp=buyPrice(i,st.turn); st.owners[i]={owner:st.turn,level:0}; pay(st.turn,bp,null); log('bought',{n:p.name,ti:i}); }
  st.pending=null; finish();
}
function actUp(yes){
  const i=st.pending.tile, p=st.players[st.turn];
  if(yes){ pay(st.turn,upCost(i,st.turn),null); st.owners[i].level++; log('upgraded',{n:p.name,ti:i,l:st.owners[i].level}); }
  st.pending=null; finish();
}
function actEnd(){ endTurn(); render(); push(); }

let npcTimer=null;
function scheduleNpc(){
  if(npcTimer){ clearTimeout(npcTimer); npcTimer=null; }
  if(!st||st.phase!=='play'||busy||!isNpc(st.turn)||!npcRunner()) return;
  npcTimer=setTimeout(npcAct,900);
}
function npcAct(){
  npcTimer=null;
  if(!st||st.phase!=='play'||busy||!isNpc(st.turn)||!npcRunner()) return;
  const p=st.players[st.turn], reserve=st.mode==='quick'?120:250;
  if(st.step==='roll'){ roll(); return; }
  if(st.pending&&st.pending.type==='buy'){ actBuy(p.money-buyPrice(st.pending.tile,st.turn)>=reserve); return; }
  if(st.pending&&st.pending.type==='up'){ actUp(p.money-upCost(st.pending.tile,st.turn)>=reserve); return; }
  actEnd();
}

function renderPanel(){
  const say=$('say'), act=$('actions'), over=$('over');
  over.innerHTML='';
  if(st.phase==='over'){
    $('panel').style.display='none';
    const w=st.winner;
    const ws=(st.ranking||active().map(i=>({i,w:worth(i)}))).concat(st.players.map((p,i)=>p.out?{i,w:0,out:true}:null).filter(Boolean));
    const rank=`<ol class="rank">${ws.map((x,k)=>`<li><span>${k+1}. ${CH[st.players[x.i].ch].e} ${esc(pname(x.i))}</span><b>${x.out?S().log.out:'$'+x.w}</b></li>`).join('')}</ol>`;
    over.innerHTML=`<div class="over"><h2>${w==null?T('draw'):T('wins',{n:pname(w)})}</h2><p>${w==null?T('drawSub'):T('winSub')}</p>${rank}
      <div class="stack">${(!net.online||net.me===0)?`<button class="primary" id="b-again">${T('again')}</button>`:`<p class="sub" style="margin:0;color:var(--ink-soft)">${T('hostAgain')}</p>`}<button class="ghost" id="b-home" style="color:var(--ink);border-color:var(--paper-dim)">${T('home')}</button></div></div>`;
    const ag=$('b-again'); if(ag) ag.onclick=again;
    $('b-home').onclick=goHome;
    return;
  }
  $('panel').style.display='';
  const p=st.players[st.turn], nm=pname(st.turn);
  if(isNpc(st.turn)){ say.innerHTML=fmt(S().log.npcTurn,{n:nm}); act.innerHTML=''; return; }
  if(!myTurn()){ say.innerHTML=T('waitTurn',{n:nm}); act.innerHTML=''; return; }
  if(st.step==='moving'){ say.innerHTML=T('moving'); act.innerHTML=''; return; }
  if(st.step==='roll'){
    say.innerHTML=net.online?T('yourTurn',{n:nm}):T('passPhone',{n:nm});
    act.innerHTML=`<button class="primary wide" id="b-roll">${T('roll')}</button>`;
    $('b-roll').onclick=roll;
  } else if(st.pending&&st.pending.type==='buy'){
    const bp=buyPrice(st.pending.tile,st.turn);
    say.innerHTML=T('buyQ',{t:tileName(st.pending.tile),p:bp});
    act.innerHTML=`<button class="primary" id="b-yes">${T('buy')}</button><button id="b-no">${T('noBuy')}</button>`;
    $('b-yes').onclick=()=>actBuy(true); $('b-no').onclick=()=>actBuy(false);
  } else if(st.pending&&st.pending.type==='up'){
    const i=st.pending.tile, uc=upCost(i,st.turn);
    say.innerHTML=T('upQ',{t:tileName(i),c:uc,a:rentOf(i),b:rentAt(i,st.turn,st.owners[i].level+1)});
    act.innerHTML=`<button class="primary" id="b-yes">${T('up')}</button><button id="b-no">${T('noUp')}</button>`;
    $('b-yes').onclick=()=>actUp(true); $('b-no').onclick=()=>actUp(false);
  } else {
    say.innerHTML=st.log[0]?logText(st.log[0]):'';
    act.innerHTML=`<button class="primary wide" id="b-end">${T('end')}</button>`;
    $('b-end').onclick=actEnd;
  }
}
function finish(){ if(st.phase==='over'){ render(); push(); return; } st.step='end'; render(); push(); }

async function roll(){
  if(busy) return; busy=true;
  const c=cfg(), p=st.players[st.turn], TT=tiles();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const d=Array.from({length:c.dice},()=>1+rnd(6)); st.dice=d; st.step='moving'; render();
  if(!reduce){ // 骰子亂跳一下
    for(let k=0;k<5;k++){ st.dice=d.map(()=>1+rnd(6)); renderBoard(); await sleep(90); }
    st.dice=d; renderBoard(); await sleep(250);
  }
  let steps=d.reduce((a,b)=>a+b,0);
  if(p.boost){ p.boost=0; steps*=2; log('boost',{n:p.name,s:steps}); } else log('roll',{n:p.name,s:steps});
  if(has(st.turn,'draven')&&d.some(x=>x===6)){ const ax=st.mode==='quick'?80:40; p.money+=ax; log('axe',{n:p.name,a:ax}); }
  for(let k=0;k<steps;k++){ p.pos=(p.pos+1)%TT.length; if(p.pos===0){ const gb=goBonus(st.turn); p.money+=gb; log('passGo',{n:p.name,b:gb}); } if(!reduce){ renderBoard(); await sleep(140); } }
  busy=false;
  land(st.turn,0);
  if(st.phase==='over'){ render(); push(); return; }
  st.step=st.pending?'decide':'end';
  render(); push();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- 大廳 / 流程 ---------- */
let homeConn='online', homeMode='quick', homeNpc=0;
document.querySelectorAll('#seg-conn button').forEach(b=>b.onclick=()=>{ homeConn=b.dataset.v; document.querySelectorAll('#seg-conn button').forEach(x=>x.classList.toggle('sel',x===b)); $('joincode').parentElement.style.display=homeConn==='online'?'':'none'; $('home-note').style.display=homeConn==='online'?'':'none'; $('f-name2').style.display=homeConn==='online'?'none':''; $('b-create').textContent=homeConn==='online'?T('create'):T('startLocal'); });
document.querySelectorAll('#seg-lang button').forEach(b=>b.onclick=()=>{ lang=b.dataset.v; applyLang(); });
$('b-lang').onclick=()=>{ lang=lang==='ja'?'zh':'ja'; applyLang(); };
$('b-layout').onclick=()=>{ layout=layout==='ring'?'snake':'ring'; applyLang(); };
document.querySelectorAll('#seg-layout button').forEach(b=>b.onclick=()=>{ layout=b.dataset.v; applyLang(); });
document.querySelectorAll('#seg-npc button').forEach(b=>b.onclick=()=>{ homeNpc=+b.dataset.v; document.querySelectorAll('#seg-npc button').forEach(x=>x.classList.toggle('sel',x===b)); });
document.querySelectorAll('#seg-mode button').forEach(b=>b.onclick=()=>{ homeMode=b.dataset.v; document.querySelectorAll('#seg-mode button').forEach(x=>x.classList.toggle('sel',x===b)); });

$('b-create').onclick=async()=>{
  const name=$('myname').value.trim(); $('home-err').textContent='';
  if(homeConn==='local'){
    net={online:false,code:'',me:0};
    const n2=$('name2').value.trim()||(lang==='ja'?'プレイヤー2':'玩家二');
    st=newState(homeMode,[name||(lang==='ja'?'プレイヤー1':'玩家一'),n2],homeNpc); assignCh(); st.phase='play'; logPicks(); log('start'); render(); return;
  }
  if(!netOK()){ $('home-err').textContent=T('e_storage'); return; }
  if(!name){ $('home-err').textContent=T('e_name'); return; }
  net={online:true,code:String(1000+rnd(9000)),me:0};
  st=newState(homeMode,[name,''],homeNpc);
  $('b-create').disabled=true; $('home-err').textContent=T('connecting');
  try{
    if(hasStorage()) await window.storage.set(key(),JSON.stringify(st),true);
    else await hostPeer();
  }catch(e){ $('home-err').textContent=T('e_create'); $('b-create').disabled=false; stopPolling(); return; }
  $('b-create').disabled=false; $('home-err').textContent='';
  render(); startPolling();
};
$('b-join').onclick=async()=>{
  const name=$('myname').value.trim(), code=$('joincode').value.trim(); $('home-err').textContent='';
  if(!netOK()){ $('home-err').textContent=T('e_storage'); return; }
  if(!name){ $('home-err').textContent=T('e_name'); return; }
  if(!/^\d{4}$/.test(code)){ $('home-err').textContent=T('e_code'); return; }
  net={online:true,code,me:1};
  $('b-join').disabled=true; $('home-err').textContent=T('connecting');
  if(hasStorage()){
    let s=null;
    try{ const r=await window.storage.get(key(),true); s=JSON.parse(r.value); }catch(e){}
    $('b-join').disabled=false;
    if(!s){ $('home-err').textContent=T('e_notfound'); return; }
    if(s.guestJoined&&s.phase!=='lobby'){ $('home-err').textContent=T('e_started'); return; }
    s.players[1].name=name; s.guestJoined=true; st=s; await push();
  } else {
    st=null;
    try{ await joinPeer(code,name); }
    catch(e){ $('b-join').disabled=false; stopPolling(); net.online=false; $('home-err').textContent=T('e_notfound'); return; }
    $('b-join').disabled=false;
    if(st.phase!=='lobby'){ $('home-err').textContent=T('e_started'); stopPolling(); net.online=false; return; }
  }
  $('home-err').textContent='';
  render(); startPolling();
};
$('b-start').onclick=async()=>{ assignCh(); st.phase='play'; logPicks(); log('start'); render(); await push(); };
$('b-leave').onclick=goHome;

function renderLobby(){
  show('s-lobby'); $('lobby-code').textContent=net.code;
  if(net.me===0){
    $('lobby-status').textContent=st.guestJoined?T('joined',{n:st.players[1].name}):T('waiting');
    $('b-start').style.display=''; $('b-start').disabled=!st.guestJoined;
  } else { $('lobby-status').textContent=T('guestWait',{n:st.players[0].name}); $('b-start').style.display='none'; }
}
function again(){
  const names=st.players.map(p=>p.name), seq=st.seq;
  st=newState(st.mode,names.slice(0,2),st.npc); st.seq=seq; assignCh(); st.phase='play'; st.guestJoined=true; logPicks(); log('again');
  render(); push();
}
function goHome(){ stopPolling(); if(npcTimer){clearTimeout(npcTimer);npcTimer=null;} st=null; net={online:false,code:'',me:0}; show('s-home'); applyLang(); }
applyLang();
